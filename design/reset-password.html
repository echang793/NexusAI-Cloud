<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set new password — NexusAI Cloud</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark" style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg);">
  <div class="card card-pad" style="width:360px;">
    <div class="brand" style="margin-bottom:20px;">
      <div class="brand-mark"></div>
      <div class="brand-name">Nexus<span class="ai">AI</span> <span class="muted" style="font-size:13px; font-weight:500;">Cloud</span></div>
    </div>
    <div style="font-size:18px; font-weight:600; margin-bottom:16px;">Set a new password</div>
    <div id="err" style="display:none; color:var(--red); font-size:13px; margin-bottom:12px;"></div>
    <div style="margin-bottom:18px;">
      <label style="display:block; font-size:12px; color:var(--text-2); margin-bottom:4px;">New password (8+ characters)</label>
      <input id="password" type="password" autocomplete="new-password"
        style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:14px; box-sizing:border-box;"/>
    </div>
    <button id="submit" class="btn-primary" style="width:100%; padding:10px;">Set password</button>
    <div class="muted" style="font-size:13px; margin-top:16px; text-align:center;">
      <a href="/login" style="color:var(--accent);">Back to log in</a>
    </div>
  </div>
<script>
  // Path is /reset-password/<token> — the token is the same for GET (this
  // page) and POST (the submit below), Flask's route param matches either way.
  const token = window.location.pathname.split("/").pop();
  const err = document.getElementById("err");

  function submit() {
    err.style.display = "none";
    const password = document.getElementById("password").value;
    if (password.length < 8) {
      err.textContent = "Password must be at least 8 characters.";
      err.style.display = "block";
      return;
    }
    fetch(`/reset-password/${token}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    })
      .then(r => r.json())
      .then(resp => {
        if (resp.ok) { window.location.href = "/"; return; }
        err.textContent = resp.error || "Couldn't reset password.";
        err.style.display = "block";
      })
      .catch(() => { err.textContent = "Couldn't reset password — try again."; err.style.display = "block"; });
  }
  document.getElementById("submit").addEventListener("click", submit);
  document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
</script>
</body>
</html>
