<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — NexusAI Cloud</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="light" style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg);">
  <div class="card card-pad" style="width:360px;">
    <div class="brand" style="margin-bottom:20px;">
      <div class="brand-mark"></div>
      <div class="brand-name">Nexus<span class="ai">AI</span> <span class="muted" style="font-size:13px; font-weight:500;">Cloud</span></div>
    </div>

    <div id="step-form">
      <div style="font-size:18px; font-weight:600; margin-bottom:8px;">Forgot your password?</div>
      <div class="muted" style="font-size:13px; margin-bottom:16px;">Enter your email and we'll send a reset link.</div>
      <div style="margin-bottom:16px;">
        <label style="display:block; font-size:12px; color:var(--text-2); margin-bottom:4px;">Email</label>
        <input id="email" type="email" autocomplete="email"
          style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:14px; box-sizing:border-box;"/>
      </div>
      <button id="submit" class="btn-primary" style="width:100%; padding:10px;">Send reset link</button>
      <div class="muted" style="font-size:13px; margin-top:16px; text-align:center;">
        <a href="/login" style="color:var(--accent);">Back to log in</a>
      </div>
    </div>

    <div id="step-sent" hidden style="text-align:center;">
      <div style="font-size:18px; font-weight:600; margin-bottom:10px;">Check your email</div>
      <div class="muted" style="font-size:13px; line-height:1.6;" id="sent-msg"></div>
      <div class="muted" style="font-size:13px; margin-top:16px;">
        <a href="/login" style="color:var(--accent);">Back to log in</a>
      </div>
    </div>
  </div>
<script>
  document.getElementById("submit").addEventListener("click", () => {
    const email = document.getElementById("email").value;
    fetch("/forgot-password", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    }).then(r => r.json()).then(resp => {
      document.getElementById("step-form").hidden = true;
      document.getElementById("sent-msg").textContent = resp.message || "If that email has an account, a reset link is on its way.";
      document.getElementById("step-sent").hidden = false;
    }).catch(() => {
      document.getElementById("step-form").hidden = true;
      document.getElementById("sent-msg").textContent = "If that email has an account, a reset link is on its way.";
      document.getElementById("step-sent").hidden = false;
    });
  });
</script>
</body>
</html>
